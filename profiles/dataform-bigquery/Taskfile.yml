# Profile: Terraform (infra/envs) + Dataform/BigQuery (transform/). Superset of the
# root terraform tasks — canonical tasks keep their semantics, Dataform is added where it
# belongs (build=+compile, credentialed runs as extensions). Note one honest gap:
# `dataform format` has no check-only mode, so lint enforces the rail naming conventions
# instead (rail FR-4) and formatting stays format's job.
# Reference implementation of the canonical task contract
# (.ai/contracts/foundation/task-targets.md); copy to the repository root as Taskfile.yml.
# naming-check keeps its find pipeline inline rather than in a separate script so that
# activation stays a single-file copy.
version: "3"

vars:
  FILE: '{{.FILE | default ""}}'
  ENV: '{{.ENV | default "dev"}}'
  TRANSFORM_DIR: '{{.TRANSFORM_DIR | default "transform"}}'
  DATAFORM_BIN: '{{.TRANSFORM_DIR}}/node_modules/.bin/dataform'
  DATAFORM: 'cd "{{.TRANSFORM_DIR}}" && npx --no-install dataform'
  COST_GATE_SQL_DIR: '{{.COST_GATE_SQL_DIR | default (printf "%s/target/compiled" .TRANSFORM_DIR)}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install git hooks and lockfile-pinned Dataform tooling
    cmds:
      - cmd: |
          if command -v pre-commit >/dev/null 2>&1; then pre-commit install --hook-type pre-commit --hook-type pre-push; else echo "pre-commit not installed — local hooks skipped (CI runs the same gates)"; fi
        silent: true
      - cmd: 'command -v npm >/dev/null 2>&1 || { echo "npm is required for the Dataform profile"; exit 1; }'
        silent: true
      - cd "{{.TRANSFORM_DIR}}" && npm ci --ignore-scripts

  format:
    desc: Auto-format terraform + SQLX (dataform format is project-wide)
    cmds:
      - cmd: terraform fmt -recursive infra
        if: '[ -z "{{.FILE}}" ]'
      - cmd: |
          if [ -x "{{.DATAFORM_BIN}}" ]; then {{.DATAFORM}} format; else echo "run task setup before formatting SQLX"; fi
        if: '[ -z "{{.FILE}}" ]'
        silent: true
      - cmd: terraform fmt "{{.FILE}}"
        if: '{{if or (hasSuffix ".tf" .FILE) (hasSuffix ".tfvars" .FILE)}}true{{else}}false{{end}}'
      - cmd: |
          if [ -x "{{.DATAFORM_BIN}}" ]; then {{.DATAFORM}} format; fi
        if: '{{if hasSuffix ".sqlx" .FILE}}true{{else}}false{{end}}'
        silent: true

  lint:
    desc: Check-only, zero warnings (COD-001); never fixes
    cmds:
      - task: naming-check
      - terraform fmt -check -recursive infra
      - cmd: |
          if command -v tflint >/dev/null 2>&1; then tflint --recursive --chdir infra; else echo "tflint not installed — CI still enforces it"; fi
        silent: true

  naming-check:
    desc: "Rail naming conventions: staging=stg_*, intermediate=int_*, marts=fct_*/dim_*"
    silent: true
    cmds:
      - |
        bad=$(
          find "{{.TRANSFORM_DIR}}/definitions/staging" -name '*.sqlx' ! -name 'stg_*' 2>/dev/null || true
          find "{{.TRANSFORM_DIR}}/definitions/intermediate" -name '*.sqlx' ! -name 'int_*' 2>/dev/null || true
          find "{{.TRANSFORM_DIR}}/definitions/marts" -name '*.sqlx' ! -name 'fct_*' ! -name 'dim_*' 2>/dev/null || true
        )
        if [ -n "$bad" ]; then echo "naming violations (stg_*/int_*/fct_*/dim_* — rail §2.2):"; echo "$bad"; exit 1; fi

  test:
    desc: Full suite
    cmds:
      - task: test-integration

  test-unit:
    desc: "Fast gate for pre-push: fmt + naming (no warehouse)"
    cmds:
      - task: naming-check
      - terraform fmt -check -recursive infra

  test-integration:
    desc: terraform test dirs + dataform assertions (dataform part needs credentials)
    vars:
      TEST_DIRS:
        sh: find infra -name '*.tftest.hcl' -exec dirname {} \; | sort -u
    cmds:
      - for: { var: TEST_DIRS }
        cmd: echo "Testing {{.ITEM}}..." && cd "{{.ITEM}}" && terraform init -backend=false -input=false >/dev/null && terraform test
      - cmd: |
          if [ -x "{{.DATAFORM_BIN}}" ] && [ -f "{{.TRANSFORM_DIR}}/.df-credentials.json" ]; then {{.DATAFORM}} test; else echo "Dataform tooling or .df-credentials.json missing — warehouse tests skipped"; fi
        silent: true

  coverage:
    desc: No line-coverage concept for IaC/SQLX; assertions above are the gate
    silent: true
    cmds:
      - 'echo "coverage: no line-coverage concept for IaC/SQLX; dataform assertion results are the gate"'

  build:
    desc: "Credential-free gates: terraform validate every env + dataform compile"
    vars:
      ENV_DIRS:
        sh: find infra/envs -mindepth 1 -maxdepth 1 -type d | sort
    cmds:
      - for: { var: ENV_DIRS }
        cmd: echo "Validating {{.ITEM}}..." && cd "{{.ITEM}}" && terraform init -backend=false -input=false >/dev/null && terraform validate
      - cmd: 'test -x "{{.DATAFORM_BIN}}" || { echo "run task setup before task build"; exit 1; }'
        silent: true
      - '{{.DATAFORM}} compile'

  run:
    desc: For IaC, "run" shows the plan; transform runs are `task dataform-run`
    cmds:
      - task: plan

  plan:
    desc: Plan the selected env (ENV=dev by default; needs credentials + backend)
    dir: infra/envs/{{.ENV}}
    cmds:
      - terraform init -input=false
      - terraform plan

  security-scan:
    desc: "Local sweep: secrets + IaC misconfig"
    cmds:
      - cd "{{.TRANSFORM_DIR}}" && npm audit --audit-level=high
      - cmd: |
          if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-banner; else echo "gitleaks not installed — CI still enforces SEC-002"; fi
        silent: true
      - cmd: |
          if command -v trivy >/dev/null 2>&1; then trivy config --exit-code 1 infra; else echo "trivy not installed — CI still enforces SEC-030"; fi
        silent: true

  sbom:
    desc: SBOM (SPDX + CycloneDX) into dist/ — REL-020
    silent: true
    cmds:
      - mkdir -p dist
      - |
        if command -v syft >/dev/null 2>&1; then syft . -o spdx-json=dist/sbom.spdx.json -o cyclonedx-json=dist/sbom.cdx.json && echo "SBOM written to dist/"; else echo "syft not installed — release workflow generates the authoritative SBOM"; fi

  clean:
    desc: Remove caches/artifacts inside the workspace only (GR-031)
    cmds:
      - find infra -type d -name ".terraform" -exec rm -rf {} + 2>/dev/null || true
      - rm -rf "{{.TRANSFORM_DIR}}/.dataform" "{{.TRANSFORM_DIR}}/node_modules" "{{.TRANSFORM_DIR}}/target" dist

  doctor:
    desc: "Foundation self-check: metadata invariants + guard-hook tests"
    silent: true
    cmds:
      - bash scripts/template-check.sh
      - bash .claude/hooks/tests/guard-bash.test.sh

  compile-cost-gate:
    desc: Install locked tooling and export credential-free compiled SQL
    cmds:
      - cmd: 'command -v npm >/dev/null 2>&1 || { echo "npm is required for compile-cost-gate"; exit 1; }'
        silent: true
      - cd "{{.TRANSFORM_DIR}}" && npm ci --ignore-scripts
      - mkdir -p "{{.TRANSFORM_DIR}}/target"
      - cd "{{.TRANSFORM_DIR}}" && npx --no-install dataform compile --json > target/dataform-graph.json
      - >-
        python3 scripts/export_dataform_sql.py --input "{{.TRANSFORM_DIR}}/target/dataform-graph.json"
        --output-dir "{{.COST_GATE_SQL_DIR}}"

  # ---------------------------------------------------------------------------
  # Project extensions — Dataform workflow (need warehouse credentials)
  # ---------------------------------------------------------------------------

  dataform-run:
    desc: Build models against the target warehouse
    cmds:
      - '{{.DATAFORM}} run'

  dataform-test:
    desc: Run dataform unit tests + assertions
    cmds:
      - '{{.DATAFORM}} test'
